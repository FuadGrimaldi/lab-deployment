---
- name: Deploy Docker
  hosts: all
  become: true
  tasks:
    - name: Include role defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../defaults/main.yml"

    - name: Include role vars
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../vars/main.yml"

    - name: Override staging directory to repo root
      ansible.builtin.set_fact:
        dest_docker_files: "{{ playbook_dir }}/../files/docker_assets"

    - name: Override staging directory to /tmp
      ansible.builtin.set_fact:
        dest_docker_file_tmp: "/tmp/docker_debs"

    - name: Run deploy tasks
      ansible.builtin.import_tasks: ../tasks/deploy.yml
